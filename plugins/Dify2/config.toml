[Dify]
enable = true          # 是否启用插件
default-model = "STUDENT"  # 默认使用的模型
commands = ["ai", "dify", "聊天", "AI", "小可爱", "ZORG", "Y3I3"]

chatroom_enable = false  # 是否启用聊天室功能：
                        # true - 用户@机器人后会自动进入聊天室，之后无需@即可聊天
                        # false - 每次对话都需要@或使用触发词，不会进入持续聊天模式
command-tip = """-----XYBot-----
💬AI聊天指令：
1. 切换模型（将会一直保持到下次切换）：
   - @学姐 切换：切换到学姐模型
   - @老夏 切换：切换到老夏模型
2. 临时使用其他模型：
   - 学姐 消息内容：临时使用学姐模型
   - 老夏 消息内容：临时使用老夏模型"""
admin_ignore = true            # 管理员是否免积分，设为true则管理员不消耗积分使用AI
whitelist_ignore = true        # 白名单用户是否免积分，设为true则白名单用户不消耗积分
http-proxy = ""                # HTTP代理配置，格式为"http://代理地址:端口"，不需要则留空
voice-reply-length = 50        # 是否总是使用语音回复，设为true则所有回复都转为语音消

robot-names = ["Y3I3", "ZORG", "小可爱"]

audio-to-text-url = "http://raspberrypi.local/v1/audio-to-text"
text-to-audio-url = "http://raspberrypi.local/v1/text-to-audio"

# 等待时间
min-countdown-hours = 1.0
max-countdown-hours = 2.0
enable-auto-message = true
auto-message = "请你模拟系统设置的角色，在微信上找对方继续刚刚的话题或者询问对方在做什么"
# 消息发送时间限制
quire-time-start = "22:30"
quire-time-end = "8:00"
enable-memory = true
max-message-entries = 30


sumnmary-workflow-api-key = "app-jR5A9PXjF3Rl4l0tMuQaeXbQ"
sumnmary-workflow-base-url = "http://raspberrypi.local/v1"

[Dify.models]
# 学姐模型配置
[Dify.models."Y3I3"]
api-key = "app-CvUVH3JbuDwILMtZqPEKl6MV"
base-url = "http://raspberrypi.local/v1"
trigger-words = ["@Y3I3", "@小可爱", "@你愿意做我的小可爱吗"]
wakeup-words = ["Y3I3", "小可爱", "你愿意做我的小可爱吗"]
price = 0

# 老夏模型配置
